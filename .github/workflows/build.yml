name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vst3:
    runs-on: macos-14
    env:
      BUNDLE: build/WinampClassicVisualizer_artefacts/Release/VST3/Winamp Classic Visualizer.vst3
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Sign ad hoc
        run: codesign --force --deep --sign - "$BUNDLE"

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate "$BUNDLE"

      - name: Package
        run: ditto -c -k --keepParent "$BUNDLE" WinampClassicVisualizer-VST3-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WinampClassicVisualizer-VST3-macOS
          path: WinampClassicVisualizer-VST3-macOS.zip
